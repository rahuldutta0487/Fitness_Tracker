apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitness-tracker
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rahuldutta0487/Fitness_Tracker.git
    targetRevision: master
    path: fitness-tracker-chart
    helm:
      valueFiles:
        - environments/prod-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: fitness-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
